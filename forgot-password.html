<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS (Beta) - Rapanui Press</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>  
    <header>
        <h1>Recuperar Contraseña - Rapanui Press</h1>
    </header>
    <main>
        <form id="forgot-password-form" action="reset-password.html" method="post">
            <div class="form-group ">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <button type="submit">Enviar Enlace de Recuperación</button>
            </div>
            <div class="form-group">
                <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión aquí</a>.</p>
            </div>
            <div class="form-group">
                <p><a href="register.html">¿No tienes cuenta? Regístrate aquí</a>.</p>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Domingo Ruiz-Tagle.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
