<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS (Beta) - Rapanui Press</title>
    <link rel="stylesheet" href="styles.css">
</html>
<body>
    <header>
        <h1>IMS Login - Rapanui Press</h1>
    </header>
    <main>
        <form id="login-form" action="dashboard.html" method="post">
            <div class="form-group
">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button type="submit">Ingresar</button>
            </div>
            <div class="form-group">
                <p>¿No tienes cuenta? <a href="register.html">Registrate aquí</a>.</p>
            </div>
            <div class="form-group">
                <p><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Domingo Ruiz-Tagle.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
